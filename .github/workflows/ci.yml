# IDauto CI.
#
# This repository had no workflow at all until 2026-09-22, which is how
# `npm test` came to be broken on a clean checkout: three suites that open a
# PostgreSQL connection had been added to `test:offline`, so the script README.md
# calls "the database-free suites" died with
# "FATAL: db.js: missing required environment variable(s)".
#
# The job below is the proof of that claim, not an assertion of it. It starts NO
# database service and sets NO IDAUTO_DB_* variable, so `npm run test:offline`
# either runs clean or the build goes red. Do not add a `services:` block or a
# database variable here — tests/test-script-coverage-test.js checks that this
# file has neither, precisely so the guarantee cannot be quietly removed.
#
# The second job is `secret-scan`. This repository is PUBLIC (`gh repo view
# othoth77/idauto --json visibility` -> PUBLIC) and had no secret gate of any
# kind, while both private sibling storefronts in MYTHOS AUTO ship one. That
# asymmetry is backwards: the repository anyone can read is the one that needed
# it first. It found docs/REAL_ANDROID_TEST.md publishing the host address next
# to the operations account name; see that job's own comments.
#
# The database suites (`npm run test:db`, `test:v12`, `test:v13`, `test:v14`) are
# deliberately NOT here. They run against a scratch database per
# ops/runbooks/TEST_RUNBOOK.md, and standing one up in CI is a separate decision
# with its own fixtures, not something to smuggle in with a workflow file.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    # `edited` so that putting a secret into the PR title/body later is scanned too.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: database-free suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Both actions pinned to commits (checkout v4.3.1, setup-node v4.4.0). `npm ci` runs
      # dependency lifecycle scripts, so no token is left in .git/config.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Assert the environment really has no database
        run: |
          set -eu
          for v in IDAUTO_DB_HOST IDAUTO_DB_PORT IDAUTO_DB_USER IDAUTO_DB_PASSWORD IDAUTO_DB_NAME; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set; this job must prove the suite needs no database"
              exit 1
            fi
          done
          echo "no IDAUTO_DB_* in the environment"

      - name: Every suite is named by exactly one script
        run: node tests/test-script-coverage-test.js

      - name: Database-free suites
        run: npm run test:offline

  # ---------------------------------------------------------------------------
  # Secret and estate hygiene. THIS REPOSITORY IS PUBLIC.
  #
  # The logic lives in .github/scripts/secret_scan.sh (rules documented in its
  # header and exercised by secret_scan_selftest.sh); this job only wires it up.
  # The job name below is what branch protection should require.
  #
  # Why it is shaped like this: the first version of this gate scanned only the
  # checked-out tree, so the fix for a published host login line re-published the
  # line in its own commit message and PR description, and the gate itself
  # embedded the host address in a bracket-escaped regex. So now:
  #   * no address or account name appears anywhere in this file or the scripts;
  #     the rules are generic (any public IPv4 literal, any user@host login line);
  #   * commit messages and the PR title/body are scanned, not just files;
  #   * a scanner failure fails the job (exit 2), it is never read as "no match".
  #
  # History is NOT rewritten. A public repository's history cannot be
  # unpublished by a force push; what this job buys is that no NEW occurrence
  # lands. PR text reaches the scanner from the event payload file, never through
  # step env, shell interpolation or argv, and the scanner never prints it.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: secret and estate hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a commit (v4.3.1); the job needs no token after checkout.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Commit messages and added lines are scanned too, which needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Scanner self-test (a regex regression must fail CI)
        run: bash .github/scripts/secret_scan_selftest.sh

      - name: Tracked files (Markdown included)
        run: bash .github/scripts/secret_scan.sh tree

      # No `env:` here, deliberately: the runner prints every step env value in the public
      # job log, which would republish the very text this step exists to keep out. The script
      # reads the PR title/body and SHAs from the event payload file ($GITHUB_EVENT_PATH).
      - name: Commit messages, added lines and PR title/body
        run: bash .github/scripts/secret_scan.sh github
