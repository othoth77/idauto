<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDauto — Pièces</title>
  <link rel="icon" type="image/svg+xml" href="/atelier/assets/favicon.svg">
  <link rel="stylesheet" href="/atelier/assets/tokens.css">
  <link rel="stylesheet" href="/atelier/assets/base.css">
  <link rel="stylesheet" href="/atelier/assets/components.css">
  <link rel="stylesheet" href="/atelier/admin.css">
</head>
<body>
<a class="ida-skip-link" href="#main">Aller au contenu</a>
<div class="ida-admin-shell">
<aside class="ida-admin-sidebar" data-admin-sidebar aria-label="Navigation principale"></aside>
<div class="ida-admin-main">
<main id="main" class="ida-container ida-u-pad-section">
  <div class="ida-stack-lg">
    <header class="ida-page-head">
      <div>
        <h1>Pièces</h1>
        <p class="ida-muted ida-u-maxch-52">Les pièces utilisées lors des interventions et leur provenance déclarée.</p>
      </div>
      <div class="ida-page-actions"></div>
    </header>
    <div id="page-status" aria-live="polite"></div>
    <section class="ida-card ida-stack" aria-labelledby="sec-p">
      <h2 id="sec-p" class="ida-sr-only">Pièces</h2>
      <form class="ida-filter-bar" id="filter" role="search">
        <div class="ida-field"><label for="f-source">Provenance</label>
          <select class="ida-input" id="f-source">
            <option value="">Toutes</option><option value="our_shop">Achetée chez nous</option><option value="customer_supplied">Fournie par le client</option>
          </select></div>
        <div class="ida-field ida-field--grow"><label for="f-q">Rechercher</label><input class="ida-input" id="f-q" type="search" maxlength="80" autocomplete="off" placeholder="Pièce, référence, immatriculation…"></div>
        <button class="ida-btn ida-btn--secondary" type="submit">Rechercher</button>
      </form>
      <div id="list" aria-live="polite" aria-busy="true"><p class="ida-muted">Chargement…</p></div>
      <p class="ida-small ida-muted">La provenance est déclarée par le technicien à l'intervention. IDauto ne gère ni vente ni facture : « achetée chez nous » n'est pas une vente prouvée.</p>
    </section>
  </div>
</main>
</div>
</div>
<script src="/atelier/i18n-catalog-ar.js"></script>
<script src="/atelier/i18n.js"></script>
<script src="/atelier/assets/ui.js"></script>
<script src="/atelier/shell.js"></script>
<script src="/atelier/console.js"></script>
<script src="/atelier/app-parts-used.js"></script>
</body>
</html>
